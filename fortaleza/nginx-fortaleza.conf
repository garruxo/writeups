# nginx como proxy inverso con TLS delante de gunicorn.
# Copia a /etc/nginx/sites-available/fortaleza y enlaza en sites-enabled.
# Con este montaje, arranca gunicorn SIN --certfile y con:
#   TRUSTED_PROXIES=127.0.0.1 REDIS_URL=redis://localhost:6379/0 \
#       gunicorn -c gunicorn_conf.py app:app

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;      # fuerza HTTPS
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/fortaleza/cert.pem;
    ssl_certificate_key /etc/fortaleza/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # IP REAL del cliente (no encadenada)
        proxy_set_header X-Forwarded-Proto https;        # para la cookie Secure / es_https()
        proxy_read_timeout 180s;                          # para /stream
        proxy_buffering off;                              # streaming en vivo
    }
}
