# Fail2Ban filter para La Fortaleza.
# Caza las lineas EXPULSADO / FRONTERA_CERRADA del log de seguridad y extrae
# la IP (<HOST>), para que fail2ban la banee en el cortafuegos (iptables).
[Definition]
failregex = ^.*SECURITY intruso ip=<HOST> motivo=EXPULSADO
            ^.*SECURITY intruso ip=<HOST> motivo=FRONTERA_CERRADA
ignoreregex =
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S
