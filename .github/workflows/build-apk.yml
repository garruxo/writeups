name: Build APK (Mapa a Junior)

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Aceptar licencias del SDK (ya preinstalado)
        run: yes | "$ANDROID_SDK_ROOT"/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Instalar Cordova
        run: npm install -g cordova@12

      - name: Crear proyecto Cordova con la app
        run: |
          cordova create cdv com.garruxo.mapajunior MapaAJunior
          rm -f cdv/www/index.html
          cp app/index.html cdv/www/index.html

      - name: Añadir plataforma Android
        working-directory: cdv
        run: cordova platform add android@13

      - name: Añadir plugin de compras (Google Play Billing)
        working-directory: cdv
        run: cordova plugin add cordova-plugin-purchase@13 --save

      - name: Firmar siempre con la misma clave + versión creciente
        working-directory: cdv
        run: |
          cp ../app/debug.keystore debug.keystore
          cat > build.json <<'J'
          {"android":{"debug":{"keystore":"debug.keystore","storePassword":"android","alias":"androiddebugkey","password":"android","keystoreType":"jks"}}}
          J
          sed -i 's/<widget /<widget android-versionCode="'"${GITHUB_RUN_NUMBER}"'" /' config.xml

      - name: Compilar APK (debug, firmado estable)
        working-directory: cdv
        run: cordova build android --buildConfig=build.json

      - name: Subir el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mapa-junior-apk
          path: cdv/platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
